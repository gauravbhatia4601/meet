[package]
name = "uplink-terminal"
version = "0.1.0"
edition = "2021"
description = "Uplink — terminal-based WebRTC video call client"
license = "MIT"

[[bin]]
name = "uplink-terminal"
path = "src/main.rs"

[dependencies]
log = { version = "0.4", features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# WebRTC
webrtc = "0.13"
# Socket.io
rust_socketio = { version = "0.6", features = ["async"] }
# Codec
openh264 = "0.6"
opus = "0.3"
# Audio I/O
cpal = "0.15"
# Webcam
nokhwa = { version = "0.10", features = ["input-avfoundation"], default-features = false }
crossterm = "0.28"
ratatui = "0.29"
# CLI
clap = { version = "4", features = ["derive"] }
# Utility
anyhow = "1.0"
serde_json = "1.0"
# Ctrl+C handling
ctrlc = "3.4"
# iTerm2 inline image output
jpeg-encoder = "0.6"
base64 = "0.22"
libc = "0.2"
unicode-width = "0.2"
# Kitty graphics protocol (iTerm2 3.6+) — raw RGB + zlib
flate2 = "1.0"
bytes = { version = "1" }

[dev-dependencies]
bytes = "1"
