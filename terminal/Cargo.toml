[package]
name = "uplink-terminal"
version = "0.1.0"
edition = "2021"
description = "Uplink — terminal-based WebRTC video call client"
license = "MIT"

[[bin]]
name = "uplink-terminal"
path = "src/main.rs"

[dependencies]
# WebRTC
webrtc = "0.12"
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# Socket.io
rust_socketio = { version = "0.6", features = ["async"] }
# Codec
openh264 = "0.6"
opus = "0.3"
# Audio I/O
cpal = "0.15"
# Webcam
nokhwa = { version = "0.10", features = ["input-avfoundation"], default-features = false }
# TUI
ratatui = "0.28"
crossterm = "0.28"
# CLI
clap = { version = "4", features = ["derive"] }
# Utility
anyhow = "1.0"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"