# Production deployment for a VPS.
#
#   docker compose up -d --build
#
# The `app` service runs the Express server + Socket.io signaling and serves the
# built client on :3001. Create a `.env` file in this directory to supply the
# variables below (see `.env.example`).
#
# TLS is NOT handled here: your domain (e.g. meet.technioz.com) is already
# SSL-protected by your existing proxy (Cloudflare / nginx / Caddy). Point that
# proxy at this VPS on port 3001. WebRTC requires HTTPS in production
# (camera/mic are only allowed in a secure context), which your proxy provides.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Your public origin, e.g. https://meet.technioz.com
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://meet.technioz.com}
      # --- TURN relay (REQUIRED for reliable calls on the public internet) ---
      # TURN/STUN URLs are fetched from the Cloudflare API on the fly, so no
      # TURN URL variables are needed. Only set the Cloudflare credentials.
      CLOUDFLARE_TURN_TOKEN_ID: ${CLOUDFLARE_TURN_TOKEN_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      CLOUDFLARE_TURN_TTL: ${CLOUDFLARE_TURN_TTL:-86400}
      # --- Room persistence (Redis) ---
      # Point at your Redis instance (e.g. the Coolify redis container).
      # When unset, rooms are in-memory only (no rejoin after empty/restart).
      REDIS_URL: ${REDIS_URL:-}
      # How long a meeting code stays valid after the last person leaves (sec).
      ROOM_TTL_SECONDS: ${ROOM_TTL_SECONDS:-604800}
