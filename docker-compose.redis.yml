# Full stack for plain-VPS deployments (docker compose -f docker-compose.redis.yml up -d --build).
#
# Room-code persistence: without Redis, room records live in the app's memory
# and every redeploy wipes them ("Room not found" mid-call). Browsers + the
# terminal auto-reconnect and rejoin; the P2P media itself never drops.
# Redis on a volume keeps meeting codes alive across deploys.
#
# Coolify does NOT use this file — Coolify apps deploy via docker-compose.yml
# (single-service). On Coolify: add a managed Redis service instead.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redis-data:/data
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "3001:3001"
      - "3478:3478/udp"
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Your public origin, e.g. https://meet.heygauravbhatia.com
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://meet.heygauravbhatia.com}
      # --- TURN relay (REQUIRED for reliable calls on the public internet) ---
      CLOUDFLARE_TURN_TOKEN_ID: ${CLOUDFLARE_TURN_TOKEN_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      CLOUDFLARE_TURN_TTL: ${CLOUDFLARE_TURN_TTL:-86400}

volumes:
  redis-data:
